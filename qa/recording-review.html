<!doctype html><html><meta charset="utf-8"><title>Source recording review</title><style>body{margin:0;background:#222;color:white;font:16px sans-serif}video{width:100%;height:85vh}nav{padding:10px}</style><video id="recording" src="/qa/source-recording.mp4" controls muted></video><nav><label>Recording time <input id="timeInput" type="number" value="0" step=".1" min="0"></label><span id="durationText"></span></nav><script>const clip=document.getElementById('recording');document.getElementById('timeInput').addEventListener('input',e=>{clip.pause();clip.currentTime=Number(e.target.value);});clip.addEventListener('loadedmetadata',()=>document.getElementById('durationText').textContent='Duration '+clip.duration);clip.addEventListener('seeked',()=>document.body.dataset.seeked=clip.currentTime.toFixed(2));</script></html>
