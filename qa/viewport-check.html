<!doctype html><html><meta charset="utf-8"><title>Animation viewport check</title><style>html,body{margin:0;background:#eee}iframe{border:0;display:block;width:390px;height:844px}</style><iframe title="Portfolio viewport"></iframe><script>const q=new URLSearchParams(location.search),w=Number(q.get('width')||390),h=Number(q.get('height')||844),frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';if(q.has('controls'))for(const [name,width,height] of [['Use mobile viewport',390,844],['Use desktop viewport',1440,900]]){const b=document.createElement('button');b.textContent=name;b.style.cssText='position:fixed;top:'+ (name.includes('mobile')?10:50)+'px;right:10px;z-index:99';b.onclick=()=>{frame.style.width=width+'px';frame.style.height=height+'px'};document.body.append(b);}frame.src=(q.get('base')||'')+'/?inspect=1&capture=1&debug=1'+(q.has('time')?'&time='+q.get('time'):'')+(q.has('motion')?'&motion='+q.get('motion'):'');</script></html>
